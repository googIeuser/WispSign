name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tag matches the project version
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $version = (python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($tag -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $version" }

      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y
      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/WispSign -DestinationPath "dist/WispSign-${{ github.ref_name }}-portable.zip"
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes (Get-ChildItem dist/WispSign-Setup-*.exe).FullName "dist/WispSign-${{ github.ref_name }}-portable.zip"
